<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07101a">
<link rel="icon" href="../assets/icon.svg">
<title>MaDen AutoSlalom v4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a10;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
#game{position:relative;width:min(100vw,560px);height:100dvh;overflow:hidden;background:#07121d}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{padding:8px 12px;border:1px solid #ffffff22;border-radius:18px;background:#06101bb8;backdrop-filter:blur(12px);font-weight:900;box-shadow:0 8px 28px #0004}
.damage{position:absolute;z-index:5;top:max(100px,calc(env(safe-area-inset-top) + 94px));left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:13px;background:#06101b88;font-size:11px;font-weight:900;color:#ffcf78;opacity:0;transition:opacity .2s}
.brand{position:absolute;z-index:5;top:max(58px,calc(env(safe-area-inset-top) + 52px));left:0;right:0;text-align:center;font-size:10px;letter-spacing:4px;color:#d7e3f2aa}
.controls{position:absolute;z-index:6;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));height:80px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.control{border:1px solid #ffffff24;border-radius:25px;background:#ffffff12;color:#fff;font-size:28px;font-weight:900;backdrop-filter:blur(14px);box-shadow:0 12px 38px #0005;touch-action:none}
.control:active{transform:scale(.97);background:#ffffff20}
.pause{position:absolute;z-index:7;top:max(58px,calc(env(safe-area-inset-top) + 52px));right:12px;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff24;background:#06101bb8;color:#fff;font-weight:900}
.overlay{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#0208109e;backdrop-filter:blur(9px)}
.card{width:min(430px,100%);padding:25px;border:1px solid #ffffff20;border-radius:30px;background:#0c1a2bd9;box-shadow:0 25px 90px #0008;text-align:center}
h1{margin:0 0 5px;font-size:34px}.sub{color:#aebaca;line-height:1.45;margin:7px 0 17px}
.label{font-size:11px;color:#8391a4;text-transform:uppercase;letter-spacing:2px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 15px}
.choice{padding:12px 5px;border:1px solid #ffffff16;border-radius:16px;background:#ffffff0c;color:#fff;font-weight:800}
.choice.selected{background:#367dff55;border-color:#6aa1ff}
.start{width:100%;height:56px;border:0;border-radius:18px;background:linear-gradient(135deg,#418dff,#795cff);color:#fff;font-size:17px;font-weight:900}
.small{font-size:12px;color:#718096;margin-top:12px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill" id="lives">❤️❤️❤️</div></div>
<div class="damage" id="damage">УРОН: 0 / 3</div>
<div class="brand">MADEN • AUTOSLALOM</div>
<button id="pause" class="pause hidden">Ⅱ</button>
<div class="controls"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div>
<div class="overlay" id="menu">
<div class="card">
<h1 id="title">🚗 AutoSlalom</h1>
<div class="sub" id="desc">Четыре дорожки. Избегай препятствий. Конусы повреждают машину: три удара — авария.</div>
<div class="label">Сложность</div>
<div class="row" id="difficulty"><button class="choice selected" data-v="easy">Лёгкая</button><button class="choice" data-v="normal">Норма</button><button class="choice" data-v="hard">Сложная</button></div>
<div class="label">Условия</div>
<div class="row" id="weather"><button class="choice selected" data-v="day">☀️ День</button><button class="choice" data-v="night">🌙 Ночь</button><button class="choice" data-v="rain">🌧 Дождь</button></div>
<button class="start" id="start">НАЧАТЬ ИГРУ</button>
<div class="small">Звук и вибрация включаются после первого нажатия.</div>
</div></div>
</div>
<script>
(()=> {
const c=document.getElementById('c'),ctx=c.getContext('2d'),game=document.getElementById('game');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),damageEl=document.getElementById('damage'),menu=document.getElementById('menu');
const title=document.getElementById('title'),desc=document.getElementById('desc'),start=document.getElementById('start'),pause=document.getElementById('pause');
let W,H,dpr=1,last=0,running=false,paused=false,score=0,lives=3,lane=1,scroll=0,spawn=0,speed=1,shake=0,flash=0,crashTimer=0,coneDamage=0,steerOffset=0;
let difficulty='easy',weather='day',obs=[],best=+localStorage.getItem('maden_autoslalom_best')||0;
let audio=null,engine=null,engineGain=null,roadAudio=null,rainAudio=null;

const levels={easy:{base:150,max:1.02,spawn:.92},normal:{base:185,max:1.28,spawn:.77},hard:{base:220,max:1.55,spawn:.63}};
const road=()=>({top:H*.14,bottom:H*.87,tw:W*.42,bw:W*.95,cx:W/2});
function resize(){let r=game.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();
function laneX(l,y){let r=road(),t=Math.max(0,Math.min(1,(y-r.top)/(r.bottom-r.top))),w=r.tw+(r.bw-r.tw)*t;return r.cx-w/2+w*(l+.5)/4}
function laneW(y){let r=road(),t=Math.max(0,Math.min(1,(y-r.top)/(r.bottom-r.top)));return (r.tw+(r.bw-r.tw)*t)/4}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function polygon(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill()}

function scene(){
 let r=road(),bg=ctx.createLinearGradient(0,0,0,H);
 if(weather==='night'){bg.addColorStop(0,'#01040b');bg.addColorStop(.55,'#071827');bg.addColorStop(1,'#02070c')}
 else if(weather==='rain'){bg.addColorStop(0,'#52616a');bg.addColorStop(.55,'#26343d');bg.addColorStop(1,'#0a151b')}
 else{bg.addColorStop(0,'#86c9ec');bg.addColorStop(.52,'#4b7587');bg.addColorStop(1,'#0b211f')}
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle=weather==='night'?'#07111a':'#20453d';ctx.beginPath();ctx.moveTo(0,r.top+40);for(let x=0;x<=W;x+=35)ctx.lineTo(x,r.top+15+Math.sin(x*.018)*35);ctx.lineTo(W,r.top+160);ctx.lineTo(0,r.top+160);ctx.closePath();ctx.fill();
 for(let i=0;i<14;i++){let y=r.top+(i*75+scroll*1.1)%(r.bottom-r.top),t=(y-r.top)/(r.bottom-r.top),side=r.tw/2+(r.bw/2-r.tw/2)*t,s=8+25*t;ctx.fillStyle=weather==='night'?'#071016':'#173b30';ctx.beginPath();ctx.arc(W/2-side-s,y,s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(W/2+side+s,y,s*1.1,0,Math.PI*2);ctx.fill()}
 let rg=ctx.createLinearGradient(0,r.top,0,r.bottom);rg.addColorStop(0,'#555f66');rg.addColorStop(1,'#11181d');ctx.fillStyle=rg;polygon([[W/2-r.tw/2,r.top],[W/2+r.tw/2,r.top],[W/2+r.bw/2,r.bottom],[W/2-r.bw/2,r.bottom]]);
 ctx.strokeStyle=weather==='rain'?'#d7a86c99':'#d8ae72';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2-r.tw/2,r.top);ctx.lineTo(W/2-r.bw/2,r.bottom);ctx.moveTo(W/2+r.tw/2,r.top);ctx.lineTo(W/2+r.bw/2,r.bottom);ctx.stroke();
 for(let l=1;l<4;l++){let y=r.top-45+(scroll%84);while(y<r.bottom){let y2=Math.min(y+38,r.bottom),x1=laneX(l-.5,y),x2=laneX(l-.5,y2);ctx.strokeStyle='#eef5fa55';ctx.lineWidth=Math.max(1.5,laneW(y)*.045);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y2);ctx.stroke();y+=84}}
 if(weather==='rain'){ctx.strokeStyle='#d9efff55';ctx.lineWidth=1;for(let i=0;i<100;i++){let x=(i*73+scroll*2.4)%W,y=(i*127+scroll*3.2)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+16);ctx.stroke()}for(let i=0;i<6;i++){let y=r.top+((i*140+scroll*1.5)%(r.bottom-r.top)),x=laneX(i%4,y);ctx.fillStyle='#9ed1e044';ctx.beginPath();ctx.ellipse(x,y,laneW(y)*.34,6,0,0,Math.PI*2);ctx.fill()}}
 if(weather==='night')headlights()
}
function headlights(){let y=H*.75,x=laneX(lane,y),w=Math.min(76,laneW(y)*.65),g=ctx.createRadialGradient(x,y,5,x,y-H*.35,w*2.3);g.addColorStop(0,'#fff6cc55');g.addColorStop(.5,'#fff6cc20');g.addColorStop(1,'#fff6cc00');ctx.fillStyle=g;polygon([[x-w*.18,y],[x-w*1.8,y-H*.45],[x+w*1.8,y-H*.45],[x+w*.18,y]])}

function car(){
 let y=H*.76,x=laneX(lane,y)+steerOffset,w=Math.min(80,laneW(y)*.67),h=w*1.47;ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.rotate(steerOffset/w*.12);
 ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(x,y+h*.45,w*.62,9,0,0,Math.PI*2);ctx.fill();
 let g=ctx.createLinearGradient(x-w/2,y-h/2,x+w/2,y+h/2);g.addColorStop(0,'#fff');g.addColorStop(.18,'#ff8a7c');g.addColorStop(.48,'#df2531');g.addColorStop(.78,'#921722');g.addColorStop(1,'#3a0b13');ctx.fillStyle=g;rr(x-w/2,y-h/2,w,h,w*.22);
 ctx.fillStyle='#111d2b';rr(x-w*.31,y-h*.29,w*.62,h*.28,w*.09);ctx.fillStyle='#31536e';rr(x-w*.24,y-h*.25,w*.48,h*.18,w*.05);
 ctx.fillStyle='#f6f2d0';rr(x-w*.38,y-h*.44,w*.25,h*.09,4);rr(x+w*.13,y-h*.44,w*.25,h*.09,4);
 ctx.fillStyle='#ff2839';rr(x-w*.38,y+h*.30,w*.25,h*.09,4);rr(x+w*.13,y+h*.30,w*.25,h*.09,4);
 ctx.fillStyle='#080c10';ctx.fillRect(x-w*.57,y-h*.08,w*.12,h*.34);ctx.fillRect(x+w*.45,y-h*.08,w*.12,h*.34);
 ctx.strokeStyle='#ffb3ab';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-w*.36,y+h*.1);ctx.lineTo(x+w*.36,y+h*.1);ctx.stroke();
 ctx.restore();
}
function obstacle(o){
 let y=o.y,x=laneX(o.lane,y),s=Math.max(18,laneW(y)*.51);ctx.save();ctx.translate(x,y);
 if(weather==='night'&&y<H*.55)ctx.globalAlpha=.10+.90*Math.max(0,(y-H*.14)/(H*.41));
 if(o.type==='cone'){ctx.fillStyle='#ff6a32';polygon([[-s*.32,s*.45],[0,-s*.55],[s*.32,s*.45]]);ctx.fillStyle='#fff0c4';ctx.fillRect(-s*.24,s*.05,s*.48,s*.12)}
 else {let g=ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);g.addColorStop(0,'#ffe07a');g.addColorStop(.45,'#f56e50');g.addColorStop(1,'#b82c40');ctx.fillStyle=g;rr(-s/2,-s*.5,s,s,s*.12);ctx.fillStyle='#1d252b';for(let i=-1;i<2;i++){ctx.save();ctx.rotate(-.48);ctx.fillRect(-s*.5+i*s*.48,-s*.08,s*.19,s*.72);ctx.restore()}}
 ctx.restore();
}
function spawnObs(){let l=Math.floor(Math.random()*4);obs.push({lane:l,y:road().top-45,type:Math.random()<.55?'cone':'barrier',passed:false,hit:false});if(score>60&&Math.random()<({easy:.08,normal:.17,hard:.27}[difficulty])){let l2=(l+1+Math.floor(Math.random()*3))%4;obs.push({lane:l2,y:road().top-170,type:'barrier',passed:false,hit:false})}}
function hit(o){return !o.hit&&o.lane===lane&&Math.abs(o.y-H*.76)<Math.max(31,laneW(H*.76)*.64)}

function loadAudio(){
 if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();
 const make=(file,loop,vol)=>{const a=new Audio('../assets/'+file);a.loop=loop;a.volume=vol;return a};
 engine=make('engine.wav',true,.28);roadAudio=make('road.wav',true,.18);rainAudio=make('rain.wav',true,.22)
}
function playImpact(){const a=new Audio('../assets/impact.wav');a.volume=.8;a.play().catch(()=>{})}
function tone(f,d,g=.04){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;a.gain.setValueAtTime(g,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function coneSound(){tone(180,.09,.035);tone(320,.05,.02)}
function passSound(){tone(660,.04,.025)}
function bonusSound(){tone(520,.08,.04);setTimeout(()=>tone(790,.13,.035),75)}
function syncAudio(){if(!engine)return;let target=paused||!running?0:1;engine.volume=.28*target;roadAudio.volume=.18*target;rainAudio.volume=weather==='rain'?.22*target:0;if(target&&engine.paused)engine.play().catch(()=>{});if(!target){engine.pause();roadAudio.pause();rainAudio.pause()}else{roadAudio.play().catch(()=>{});if(weather==='rain')rainAudio.play().catch(()=>{})}}

function update(dt){
 let v=levels[difficulty].base*(.73+speed*.43);scroll=(scroll+v*dt)%1000;spawn-=dt;syncAudio();
 if(spawn<=0){spawnObs();spawn=levels[difficulty].spawn*(.82+Math.random()*.3)/speed}
 for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=v*dt*(1+Math.max(0,o.y/H)*.6);
  if(!o.passed&&o.y>H*.76+38){o.passed=true;score++;scoreEl.textContent=score;passSound();if(navigator.vibrate)navigator.vibrate(18);if(score%200===0&&lives<3){lives++;updateLives();bonusSound()}speed=Math.min(levels[difficulty].max,speed+.012)}
  if(weather==='rain'&&o.y>H*.65&&o.y<H*.78&&Math.random()<.0025){steerOffset+=(Math.random()<.5?-1:1)*laneW(H*.76)*.55;shake=5}
  if(hit(o)){if(o.type==='cone')coneHit(o);else crash();return}
  if(o.y>H+100)obs.splice(i,1)
 }
 steerOffset*=Math.pow(.02,dt);if(shake)shake=Math.max(0,shake-dt*48);if(flash)flash-=dt
}
function coneHit(o){o.hit=true;obs.splice(obs.indexOf(o),1);coneDamage++;damageEl.textContent=`УРОН: ${coneDamage} / 3`;damageEl.style.opacity=1;coneSound();if(navigator.vibrate)navigator.vibrate([25,25,40]);flash=.12;setTimeout(()=>damageEl.style.opacity=0,800);if(coneDamage>=3)crash()}
function crash(){lives--;updateLives();playImpact();if(navigator.vibrate)navigator.vibrate([100,60,180]);flash=.7;shake=25;running=false;crashTimer=1400;setTimeout(()=>{if(lives<=0)end();else{obs=[];lane=1;coneDamage=0;damageEl.textContent='УРОН: 0 / 3';speed=Math.max(.78,speed-.08);crashTimer=0;running=true;syncAudio()}},crashTimer)}
function updateLives(){livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function end(){best=Math.max(best,score);localStorage.setItem('maden_autoslalom_best',best);title.textContent='💥 АВАРИЯ';desc.innerHTML=`Счёт: <b>${score}</b><br>Рекорд: <b>${best}</b>`;start.textContent='ИГРАТЬ СНОВА';pause.classList.add('hidden');menu.classList.remove('hidden');syncAudio()}
function render(){scene();obs.sort((a,b)=>a.y-b.y).forEach(obstacle);car();if(flash>0){ctx.fillStyle=`rgba(255,45,35,${Math.min(.65,flash*1.7)})`;ctx.fillRect(0,0,W,H)}}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(running&&!paused)update(dt);render();requestAnimationFrame(loop)}
function move(d){if(!running||paused||crashTimer)return;lane=Math.max(0,Math.min(3,lane+d));if(navigator.vibrate)navigator.vibrate(8)}
function startGame(){loadAudio();if(audio.state==='suspended')audio.resume();score=0;lives=3;lane=1;obs=[];spawn=.35;scroll=0;speed=1;coneDamage=0;crashTimer=0;paused=false;scoreEl.textContent=0;updateLives();damageEl.textContent='УРОН: 0 / 3';damageEl.style.opacity=0;menu.classList.add('hidden');pause.classList.remove('hidden');running=true;syncAudio()}
document.querySelectorAll('#difficulty .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#difficulty .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');difficulty=b.dataset.v});
document.querySelectorAll('#weather .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#weather .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');weather=b.dataset.v});
start.onclick=startGame;document.getElementById('left').onpointerdown=e=>{e.preventDefault();move(-1)};document.getElementById('right').onpointerdown=e=>{e.preventDefault();move(1)};
pause.onclick=()=>{if(!running)return;paused=!paused;pause.textContent=paused?'▶':'Ⅱ';syncAudio()};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key===' '&&!running)startGame()});
updateLives();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
