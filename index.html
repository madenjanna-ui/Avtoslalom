<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07101a">
<title>MaDen AutoSlalom v3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a10;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
#game{position:relative;width:min(100vw,560px);height:100dvh;overflow:hidden;background:#07121d}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.pill{padding:8px 12px;border:1px solid #ffffff22;border-radius:18px;background:#06101bb8;backdrop-filter:blur(12px);font-weight:900;box-shadow:0 8px 28px #0004}
.brand{position:absolute;z-index:5;top:max(58px,calc(env(safe-area-inset-top) + 52px));left:0;right:0;text-align:center;font-size:10px;letter-spacing:4px;color:#d7e3f2aa}
.controls{position:absolute;z-index:6;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));height:80px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.control{border:1px solid #ffffff24;border-radius:25px;background:#ffffff12;color:#fff;font-size:28px;font-weight:900;backdrop-filter:blur(14px);box-shadow:0 12px 38px #0005;touch-action:none}
.control:active{transform:scale(.97);background:#ffffff20}
.pause{position:absolute;z-index:7;top:max(58px,calc(env(safe-area-inset-top) + 52px));right:12px;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff24;background:#06101bb8;color:#fff;font-weight:900}
.overlay{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#0208109e;backdrop-filter:blur(9px)}
.card{width:min(430px,100%);padding:25px;border:1px solid #ffffff20;border-radius:30px;background:#0c1a2bd9;box-shadow:0 25px 90px #0008;text-align:center}
h1{margin:0 0 5px;font-size:34px}.sub{color:#aebaca;line-height:1.45;margin:7px 0 17px}
.label{font-size:11px;color:#8391a4;text-transform:uppercase;letter-spacing:2px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 15px}
.choice{padding:12px 5px;border:1px solid #ffffff16;border-radius:16px;background:#ffffff0c;color:#fff;font-weight:800}
.choice.selected{background:#367dff55;border-color:#6aa1ff}
.start{width:100%;height:56px;border:0;border-radius:18px;background:linear-gradient(135deg,#418dff,#795cff);color:#fff;font-size:17px;font-weight:900}
.small{font-size:12px;color:#718096;margin-top:12px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill" id="lives">❤️❤️❤️</div></div>
<div class="brand">MADEN • AUTOSLALOM</div>
<button id="pause" class="pause hidden">Ⅱ</button>
<div class="controls"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div>
<div class="overlay" id="menu">
<div class="card">
<h1 id="title">🚗 AutoSlalom</h1>
<div class="sub" id="desc">Избегай препятствий на четырёх дорожках. Каждые 200 очков восстанавливается попытка.</div>
<div class="label">Сложность</div>
<div class="row" id="difficulty"><button class="choice selected" data-v="easy">Лёгкая</button><button class="choice" data-v="normal">Норма</button><button class="choice" data-v="hard">Сложная</button></div>
<div class="label">Условия</div>
<div class="row" id="weather"><button class="choice selected" data-v="day">☀️ День</button><button class="choice" data-v="night">🌙 Ночь</button><button class="choice" data-v="rain">🌧 Дождь</button></div>
<button class="start" id="start">НАЧАТЬ ИГРУ</button>
<div class="small">Звук и вибрация включаются после первого нажатия.</div>
</div></div>
</div>
<script>
(()=> {
const c=document.getElementById('c'),ctx=c.getContext('2d'),game=document.getElementById('game');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),menu=document.getElementById('menu');
const title=document.getElementById('title'),desc=document.getElementById('desc'),start=document.getElementById('start'),pause=document.getElementById('pause');
let W,H,dpr=1,last=0,running=false,paused=false,score=0,lives=3,lane=1,scroll=0,spawn=0,speed=1,shake=0,flash=0,crashTimer=0;
let difficulty='easy',weather='day',obs=[],best=+localStorage.getItem('maden_autoslalom_best')||0;
let audio=null,engine=null,engineGain=null;

const levels={easy:{base:150,max:1.02,spawn:.92},normal:{base:185,max:1.28,spawn:.77},hard:{base:220,max:1.55,spawn:.63}};
const road=()=>({top:H*.14,bottom:H*.87,tw:W*.42,bw:W*.95,cx:W/2});
function resize(){let r=game.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();
function laneX(l,y){let r=road(),t=Math.max(0,Math.min(1,(y-r.top)/(r.bottom-r.top))),w=r.tw+(r.bw-r.tw)*t;return r.cx-w/2+w*(l+.5)/4}
function laneW(y){let r=road(),t=Math.max(0,Math.min(1,(y-r.top)/(r.bottom-r.top)));return (r.tw+(r.bw-r.tw)*t)/4}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function polygon(points){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}

function scene(){
 let r=road(),bg=ctx.createLinearGradient(0,0,0,H);
 if(weather==='night'){bg.addColorStop(0,'#01040b');bg.addColorStop(.55,'#071827');bg.addColorStop(1,'#02070c')}
 else if(weather==='rain'){bg.addColorStop(0,'#52616a');bg.addColorStop(.55,'#26343d');bg.addColorStop(1,'#0a151b')}
 else{bg.addColorStop(0,'#86c9ec');bg.addColorStop(.52,'#4b7587');bg.addColorStop(1,'#0b211f')}
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 // mountains / city silhouettes
 ctx.fillStyle=weather==='night'?'#07111a':'#20453d';
 ctx.beginPath();ctx.moveTo(0,r.top+40);for(let x=0;x<=W;x+=35)ctx.lineTo(x,r.top+15+Math.sin(x*.018)*35);ctx.lineTo(W,r.top+160);ctx.lineTo(0,r.top+160);ctx.closePath();ctx.fill();
 for(let i=0;i<14;i++){let y=r.top+(i*75+scroll*1.1)%(r.bottom-r.top),t=(y-r.top)/(r.bottom-r.top),side=r.tw/2+(r.bw/2-r.tw/2)*t,s=8+25*t;
   ctx.fillStyle=weather==='night'?'#071016':'#173b30';ctx.beginPath();ctx.arc(W/2-side-s,y,s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(W/2+side+s,y,s*1.1,0,Math.PI*2);ctx.fill()
 }
 // road
 let rg=ctx.createLinearGradient(0,r.top,0,r.bottom);rg.addColorStop(0,'#555f66');rg.addColorStop(1,'#11181d');
 ctx.fillStyle=rg;polygon([[W/2-r.tw/2,r.top],[W/2+r.tw/2,r.top],[W/2+r.bw/2,r.bottom],[W/2-r.bw/2,r.bottom]]);
 ctx.strokeStyle=weather==='rain'?'#d7a86c99':'#d8ae72';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2-r.tw/2,r.top);ctx.lineTo(W/2-r.bw/2,r.bottom);ctx.moveTo(W/2+r.tw/2,r.top);ctx.lineTo(W/2+r.bw/2,r.bottom);ctx.stroke();
 for(let l=1;l<4;l++){let y=r.top-45+(scroll%84);while(y<r.bottom){let y2=Math.min(y+38,r.bottom),x1=laneX(l-.5,y),x2=laneX(l-.5,y2);ctx.strokeStyle='#eef5fa55';ctx.lineWidth=Math.max(1.5,laneW(y)*.045);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y2);ctx.stroke();y+=84}}
 // roadside signs
 for(let i=0;i<5;i++){let y=r.top+((i*170+scroll*1.4)%(r.bottom-r.top)),t=(y-r.top)/(r.bottom-r.top),side=r.tw/2+(r.bw/2-r.tw/2)*t,s=4+12*t;
   ctx.strokeStyle='#9ea6aa';ctx.lineWidth=Math.max(1,s*.12);ctx.beginPath();ctx.moveTo(W/2-side,y);ctx.lineTo(W/2-side,y-s*3);ctx.stroke();
   ctx.fillStyle='#e74b43';ctx.beginPath();ctx.arc(W/2-side,y-s*3,s,0,Math.PI*2);ctx.fill()
 }
 if(weather==='rain'){
   ctx.strokeStyle='#d9efff55';ctx.lineWidth=1;for(let i=0;i<100;i++){let x=(i*73+scroll*2.4)%W,y=(i*127+scroll*3.2)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+16);ctx.stroke()}
   for(let i=0;i<6;i++){let y=r.top+((i*140+scroll*1.5)%(r.bottom-r.top)),x=laneX(i%4,y);ctx.fillStyle='#9ed1e044';ctx.beginPath();ctx.ellipse(x,y,laneW(y)*.34,6,0,0,Math.PI*2);ctx.fill()}
 }
 if(weather==='night') headlights();
}
function headlights(){
 let y=H*.75,x=laneX(lane,y),w=Math.min(76,laneW(y)*.65),g=ctx.createRadialGradient(x,y,5,x,y-H*.35,w*2.3);
 g.addColorStop(0,'#fff6cc55');g.addColorStop(.5,'#fff6cc20');g.addColorStop(1,'#fff6cc00');ctx.fillStyle=g;
 polygon([[x-w*.18,y],[x-w*1.8,y-H*.45],[x+w*1.8,y-H*.45],[x+w*.18,y]])
}
function car(){
 let y=H*.76,x=laneX(lane,y),w=Math.min(78,laneW(y)*.66),h=w*1.45;ctx.save();
 if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(x,y+h*.45,w*.6,9,0,0,Math.PI*2);ctx.fill();
 let g=ctx.createLinearGradient(x-w/2,y-h/2,x+w/2,y+h/2);g.addColorStop(0,'#f3f7fb');g.addColorStop(.25,'#7da4c8');g.addColorStop(.65,'#304c68');g.addColorStop(1,'#111b28');
 ctx.fillStyle=g;rr(x-w/2,y-h/2,w,h,w*.22);
 ctx.fillStyle='#14283a';rr(x-w*.31,y-h*.27,w*.62,h*.26,w*.09);
 ctx.fillStyle='#eaf0f4';rr(x-w*.37,y-h*.44,w*.24,h*.09,4);rr(x+w*.13,y-h*.44,w*.24,h*.09,4);
 ctx.fillStyle='#e34b52';rr(x-w*.37,y+h*.31,w*.24,h*.08,4);rr(x+w*.13,y+h*.31,w*.24,h*.08,4);
 ctx.fillStyle='#090d12';ctx.fillRect(x-w*.56,y-h*.1,w*.12,h*.32);ctx.fillRect(x+w*.44,y-h*.1,w*.12,h*.32);
 ctx.fillStyle='#dce5ec33';rr(x-w*.23,y-h*.49,w*.46,h*.04,2);ctx.restore();
}
function obstacle(o){
 let y=o.y,x=laneX(o.lane,y),s=Math.max(18,laneW(y)*.51);ctx.save();ctx.translate(x,y);
 if(weather==='night'&&y<H*.55)ctx.globalAlpha=.14+.86*Math.max(0,(y-H*.14)/(H*.41));
 if(o.type==='cone'){ctx.fillStyle='#ff6a32';polygon([[-s*.32,s*.45],[0,-s*.55],[s*.32,s*.45]]);ctx.fillStyle='#fff0c4';ctx.fillRect(-s*.24,s*.05,s*.48,s*.12)}
 else if(o.type==='barrier'){let g=ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);g.addColorStop(0,'#ffd96c');g.addColorStop(.5,'#f66b4f');g.addColorStop(1,'#c93548');ctx.fillStyle=g;rr(-s/2,-s*.5,s,s,s*.12);ctx.fillStyle='#1d252b';for(let i=-1;i<2;i++){ctx.save();ctx.rotate(-.48);ctx.fillRect(-s*.5+i*s*.48,-s*.08,s*.19,s*.72);ctx.restore()}}
 else{ctx.fillStyle='#78848a';rr(-s*.52,-s*.34,s*1.04,s*.68,s*.1);ctx.fillStyle='#d7dee2';ctx.fillRect(-s*.44,-s*.05,s*.88,s*.08);ctx.fillStyle='#323c42';ctx.fillRect(-s*.38,s*.18,s*.16,s*.35);ctx.fillRect(s*.22,s*.18,s*.16,s*.35)}
 ctx.restore();
}
function spawnObs(){let l=Math.floor(Math.random()*4),types=['barrier','cone','barrier'];obs.push({lane:l,y:road().top-45,type:types[Math.floor(Math.random()*types.length)],passed:false,hit:false});
 if(score>60&&Math.random()<({easy:.08,normal:.17,hard:.27}[difficulty])){let l2=(l+1+Math.floor(Math.random()*3))%4;obs.push({lane:l2,y:road().top-170,type:'barrier',passed:false,hit:false})}}
function hit(o){return !o.hit&&o.lane===lane&&Math.abs(o.y-H*.76)<Math.max(31,laneW(H*.76)*.64)}

function initAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();engine=audio.createOscillator();engineGain=audio.createGain();engine.type='sawtooth';engineGain.gain.value=.015;engine.frequency.value=90;engine.connect(engineGain).connect(audio.destination);engine.start()}
function tone(f,d,g=.04,type='triangle'){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(g,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function gravel(){if(!audio)return;let b=audio.createBuffer(1,audio.sampleRate*.08,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);let s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='bandpass';f.frequency.value=900;g.gain.value=.03;s.buffer=b;s.connect(f).connect(g).connect(audio.destination);s.start()}
function crashSound(){tone(75,.38,.12,'sawtooth');setTimeout(()=>tone(42,.5,.08,'square'),80)}
function passedSound(){tone(640,.045,.03)}
function bonusSound(){tone(520,.08,.045);setTimeout(()=>tone(790,.13,.04),75)}

function update(dt){
 let v=levels[difficulty].base*(.73+speed*.43);scroll=(scroll+v*dt)%1000;spawn-=dt;
 if(spawn<=0){spawnObs();spawn=levels[difficulty].spawn*(.82+Math.random()*.3)/speed}
 for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=v*dt*(1+Math.max(0,o.y/H)*.6);
   if(!o.passed&&o.y>H*.76+38){o.passed=true;score++;scoreEl.textContent=score;passedSound();if(navigator.vibrate)navigator.vibrate(18);if(score%200===0&&lives<3){lives++;updateLives();bonusSound()}speed=Math.min(levels[difficulty].max,speed+.012)}
   if(weather==='rain'&&o.y>H*.65&&o.y<H*.78&&Math.random()<.0028){lane=Math.max(0,Math.min(3,lane+(Math.random()<.5?-1:1)));shake=6}
   if(hit(o)){crash(o);return}if(o.y>H+100)obs.splice(i,1)
 }
 if(shake)shake=Math.max(0,shake-dt*48);if(flash)flash-=dt
}
function crash(o){o.hit=true;lives--;updateLives();crashSound();if(navigator.vibrate)navigator.vibrate([90,50,160]);flash=.55;shake=22;running=false;crashTimer=1250;
 setTimeout(()=>{if(lives<=0)end();else{obs=[];lane=1;speed=Math.max(.78,speed-.08);crashTimer=0;running=true}},crashTimer)}
function updateLives(){livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function end(){best=Math.max(best,score);localStorage.setItem('maden_autoslalom_best',best);title.textContent='💥 АВАРИЯ';desc.innerHTML=`Счёт: <b>${score}</b><br>Рекорд: <b>${best}</b>`;start.textContent='ИГРАТЬ СНОВА';pause.classList.add('hidden');menu.classList.remove('hidden')}
function render(){scene();obs.sort((a,b)=>a.y-b.y).forEach(obstacle);car();if(flash>0){ctx.fillStyle=`rgba(255,45,35,${Math.min(.6,flash*1.7)})`;ctx.fillRect(0,0,W,H)}}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(running&&!paused)update(dt);render();requestAnimationFrame(loop)}
function move(d){if(!running||paused||crashTimer)return;lane=Math.max(0,Math.min(3,lane+d));gravel();if(navigator.vibrate)navigator.vibrate(8)}
function startGame(){initAudio();if(audio.state==='suspended')audio.resume();score=0;lives=3;lane=1;obs=[];spawn=.35;scroll=0;speed=1;crashTimer=0;paused=false;scoreEl.textContent=0;updateLives();menu.classList.add('hidden');pause.classList.remove('hidden');running=true}
document.querySelectorAll('#difficulty .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#difficulty .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');difficulty=b.dataset.v});
document.querySelectorAll('#weather .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#weather .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');weather=b.dataset.v});
start.onclick=startGame;document.getElementById('left').onpointerdown=e=>{e.preventDefault();move(-1)};document.getElementById('right').onpointerdown=e=>{e.preventDefault();move(1)};
pause.onclick=()=>{if(!running)return;paused=!paused;pause.textContent=paused?'▶':'Ⅱ';if(engineGain)engineGain.gain.value=paused?0:.015};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key===' '&&!running)startGame()});
updateLives();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
